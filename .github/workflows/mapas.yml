# Avexe - gera os mapas sem internet e publica numa versao (release) deste repositorio.
# Roda sozinho no dia 5 de cada mes e quando voce toca em "Run workflow" (aba Actions).
name: Mapas do Avexe

on:
  schedule:
    - cron: "17 6 5 * *"
  workflow_dispatch:
    inputs:
      regiao:
        description: "Teste rapido: nome de UMA cidade (ex.: Garanhuns) ou codigo IBGE da regiao. Vazio = Brasil inteiro."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mapas
  cancel-in-progress: false

jobs:
  mapas:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaco no disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gerar os mapas
        env:
          REGIAO: ${{ github.event.inputs.regiao }}
          MEMORIA: 11g
        run: |
          TAG="mapas-$(date -u +%Y%m%d-%H%M)"
          [ -n "$REGIAO" ] && TAG="teste-$(date -u +%Y%m%d-%H%M)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          export BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/"
          bash gerar.sh

      - name: Publicar a versao
        env:
          GH_TOKEN: ${{ github.token }}
          REGIAO: ${{ github.event.inputs.regiao }}
        run: |
          if [ -n "$REGIAO" ]; then LATEST="--latest=false --prerelease"; else LATEST="--latest"; fi
          gh release create "$TAG" --title "$TAG" $LATEST \
            --notes "Mapas sem internet do Avexe, por regiao imediata do IBGE. Dados (c) colaboradores do OpenStreetMap, licenca ODbL (https://www.openstreetmap.org/copyright)."
          cd saida
          ls -1 | xargs -n 20 sh -c 'for t in 1 2 3; do gh release upload "$TAG" "$@" --clobber && exit 0; sleep 20; done; exit 1' _
          echo "Catalogo: https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/catalogo.txt"

      - name: Apagar versoes antigas (fica so as 2 ultimas do Brasil inteiro)
        if: ${{ github.event.inputs.regiao == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease | not) | .tagName' \
            | grep '^mapas-' | tail -n +3 | while read -r t; do gh release delete "$t" --yes --cleanup-tag; done
